# Temporary live trial of the new MergeJudge sticky layout (mergejudge-runner#29). Removed again after the trial.
# AI via GitHub Models with the workflow token, so no extra secrets are needed.
name: MergeJudge layout trial

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write
  models: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Probe GitHub Models (debug, prints no secrets)
        env:
          GH_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          B='{"model":"openai/gpt-4.1-mini","max_tokens":50,"messages":[{"role":"user","content":"Say hi"}]}'
          for u in https://models.github.ai/inference/chat/completions https://models.github.ai/orgs/gauravsharmaGG/inference/chat/completions; do
            echo "== $u"; curl -sS -L -o /tmp/r.json -w 'http=%{http_code} type=%{content_type} url=%{url_effective}\n' "$u" \
              -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" -H "Authorization: Bearer $GH_MODELS_TOKEN" -d "$B"; head -c 600 /tmp/r.json; echo
          done
          echo "== azure"; curl -sS -o /tmp/r.json -w 'http=%{http_code} type=%{content_type}\n' https://models.inference.ai.azure.com/chat/completions \
            -H "Content-Type: application/json" -H "Authorization: Bearer $GH_MODELS_TOKEN" -d '{"model":"gpt-4o-mini","max_tokens":20,"messages":[{"role":"user","content":"Say hi"}]}'; head -c 600 /tmp/r.json; echo
          getent hosts models.github.ai || true
      - uses: gauravsharmaGG/mergejudge-runner@709ac93386cea574053de08e698b91ac82e2af90
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          provider: openai-compatible
          base_url: https://models.github.ai/inference
          model: openai/gpt-4.1-mini
          api_key_env: GH_MODELS_TOKEN
        env:
          GH_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
