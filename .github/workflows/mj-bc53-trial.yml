# Temporary live test of the mergejudge-fix skill (bot-context#53).
# Lives only on the temp base branch agent/bc53-fix-base; removed after the test. AI via z.ai with the AI_API_KEY secret.
name: MergeJudge fix-skill trial

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [agent/bc53-fix-base]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: gauravsharmaGG/mergejudge-runner@865fd2ffbd6d793365c7476272b9de52e6f91e0d
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          provider: zai
          model: glm-4.6
          api_key_env: AI_API_KEY
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
